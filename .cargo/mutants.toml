# Le test de mutation du noyau (famille 3 des garde-fous de la méthode).
# Douze modules sont examinés : la théorie (hauteurs, tonalités, accords, table), la palette, le
# clavier et la guitare, et les règles des données (la compaction, l'accès d'un document, le
# démarrage, la version de schéma et la comparaison des copies).
# Le rendu (`rendu/`) n'est pas examiné.
examine_globs = [
    "crates/noyau/src/hauteur.rs",
    "crates/noyau/src/tonalite.rs",
    "crates/noyau/src/accord.rs",
    "crates/noyau/src/table.rs",
    "crates/noyau/src/palette.rs",
    "crates/noyau/src/clavier.rs",
    "crates/noyau/src/guitare.rs",
    "crates/noyau/src/donnees/acces.rs",
    "crates/noyau/src/donnees/compaction.rs",
    "crates/noyau/src/donnees/copie.rs",
    "crates/noyau/src/donnees/demarrage.rs",
    "crates/noyau/src/donnees/version.rs",
]

# Chaque mutant ne rejoue que les tests de ces douze modules, et les tests unitaires : les tests du
# rendu dessinent les 48 pages de table, les 72 versos et les fiches de chaque case, et la suite
# complète prend une minute et demie en debug, contre deux secondes et demie sans eux. Ils
# appellent la théorie sans la vérifier : ses propres tests tuent tous ses mutants (0 survivant
# en PR #5, avant le rendu). Un nouveau fichier de tests de ces modules s'ajoute à cette liste.
additional_cargo_test_args = [
    "--lib",
    "--test", "hauteur",
    "--test", "tonalite",
    "--test", "accord",
    "--test", "table",
    "--test", "palette",
    "--test", "oracle_palette",
    "--test", "clavier",
    "--test", "guitare",
    "--test", "donnees",
    "--test", "demarrage",
]

# Un mutant réellement équivalent s'exclut ici, nommément, avec sa raison.
exclude_re = [
    # Équivalent : à 0, `signe` rend la chaîne vide, que l'altération soit rangée
    # parmi les bémols ou parmi les dièses. Aucun test ne peut les distinguer.
    "replace < with <= in signe",
    # Boucle sans fin, non un survivant : `enharmonique_simple` boucle tant que
    # l'altération dépasse un cran, et ces mutants (rang ou naturel de la lettre faussés,
    # décalage ou condition de la boucle faussés) l'empêchent de converger. Le délai les
    # attrape (TIMEOUT), mais cargo-mutants sort alors en 3 et ferait échouer la porte.
    "replace Lettre::rang -> i8 with (0|1|-1)$",
    "replace Lettre::naturel -> i8 with (0|1|-1)$",
    'replace \+ with \* in Lettre::decalee',
    "replace > with (==|<|>=) in NomDeNote::enharmonique_simple",
]
