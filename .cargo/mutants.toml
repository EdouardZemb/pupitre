# palette, le clavier et la guitare, et les règles des données (la compaction, l'accès d'un
# document, le démarrage, la version de schéma, la teneur, la comparaison des copies et des
# lignées, les identifiants, les gestes, les règles d'une idée, la boîte, le repli des textes, les
# jours et les bornes d'une période, les critères d'une requête, l'index et sa réponse, le journal
# rangé et son empreinte, les signatures et les extensions, les en-têtes d'un WAV et d'un MIDI, le
# texte lisible).
