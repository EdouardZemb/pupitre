<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#fff"/>
  <!-- la tablette du pupitre -->
  <rect x="192" y="160" width="640" height="440" fill="#fff" stroke="#000" stroke-width="40"/>
  <!-- cinq lignes de portée -->
  <g stroke="#000" stroke-width="24">
    <line x1="256" y1="260" x2="768" y2="260"/>
    <line x1="256" y1="320" x2="768" y2="320"/>
    <line x1="256" y1="380" x2="768" y2="380"/>
    <line x1="256" y1="440" x2="768" y2="440"/>
    <line x1="256" y1="500" x2="768" y2="500"/>
  </g>
  <!-- le pied -->
  <line x1="512" y1="600" x2="512" y2="840" stroke="#000" stroke-width="40"/>
  <line x1="512" y1="840" x2="300" y2="920" stroke="#000" stroke-width="40" stroke-linecap="square"/>
  <line x1="512" y1="840" x2="724" y2="920" stroke="#000" stroke-width="40" stroke-linecap="square"/>
</svg>
