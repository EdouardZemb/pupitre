[package]
name = "etabli"
description = "L'établi de pupitre : l'application de bureau et d'appareil, en Tauri 2"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
name = "etabli_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
cahier = { path = "../../crates/cahier" }
noyau = { path = "../../crates/noyau" }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
