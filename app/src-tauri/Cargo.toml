[package]
name = "etabli"
description = "L'établi de pupitre : l'application de bureau et d'appareil, en Tauri 2"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
name = "etabli_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
cahier = { path = "../../crates/cahier" }
noyau = { path = "../../crates/noyau" }
stockage = { path = "../../crates/stockage" }
services = { path = "../../crates/services" }
commandes = { path = "../../crates/commandes" }
getrandom = "0.4.3"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"

[dev-dependencies]
tauri = { version = "2.12.5", features = ["test"] }
serde_json = "1.0.154"
