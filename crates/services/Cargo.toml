[package]
name = "services"
description = "Les services de pupitre : les opérations nommées et les lectures du fonds, conduites sur les contrats Documents et Captations"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
automerge = "0.12.0"
commandes = { path = "../commandes" }
noyau = { path = "../noyau" }

# `en-memoire` compile la paire d'adaptateurs en mémoire, `DocumentsEnMemoire` et
# `CaptationsEnMemoire` : ses tests et ceux du stockage la demandent, par leur dépendance sur les
# services ; l'établi, jamais.
[features]
en-memoire = []

[dev-dependencies]
services = { path = ".", features = ["en-memoire"] }
