[package]
name = "stockage"
description = "Le stockage de pupitre, côté natif : la racine des données, les documents et les captations sur fichiers"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
automerge = "0.12.0"
noyau = { path = "../noyau" }
services = { path = "../services" }
synchro = { path = "../synchro" }

# `pannes` coupe une écriture à l'étape voulue, en injectant une panne à chacune de ses étapes ;
# elle ouvre le fonds selon les migrations qu'un test lui donne (`RacineDesDonnees::fonds_selon`,
# `FondsSurFichiers::ouvrir_selon`), et garde pour les tests l'écriture et la naissance par une
# fermeture (`Document::ecrire`, `RacineDesDonnees::faire_naitre_le_fonds`, `Naissance`) : ses
# tests seuls la demandent, par leur dépendance sur le stockage même.
[features]
pannes = []

[dev-dependencies]
# La suite des commandes, que les tests incluent (`tests/commandes_sur_fichiers.rs`), nomme les
# types de `commandes` : un test ne voit que les dépendances et les dépendances de test du
# stockage.
commandes = { path = "../commandes" }
proptest = "1.12.0"
services = { path = "../services", features = ["en-memoire"] }
stockage = { path = ".", features = ["pannes"] }
