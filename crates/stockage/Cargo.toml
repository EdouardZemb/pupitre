[package]
name = "stockage"
description = "Le stockage de pupitre, côté natif : la racine des données, les documents et les captations sur fichiers"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
automerge = "0.12.0"
noyau = { path = "../noyau" }
synchro = { path = "../synchro" }

# `pannes` injecte une panne à chaque étape d'une écriture, et compile
# `RacineDesDonnees::fonds_selon`, qui ouvre le fonds selon les migrations qu'un test lui donne :
# ses tests seuls la demandent, par leur dépendance sur le stockage même.
[features]
pannes = []

[dev-dependencies]
# La suite des commandes, que les tests incluent (`tests/commandes_sur_fichiers.rs`), nomme les
# types de `commandes` : un test ne voit que les dépendances et les dépendances de test du
# stockage.
commandes = { path = "../commandes" }
proptest = "1.12.0"
services = { path = "../services", features = ["en-memoire"] }
stockage = { path = ".", features = ["pannes"] }
