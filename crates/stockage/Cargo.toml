[package]
name = "stockage"
description = "Le stockage de pupitre, côté natif : la racine des données, les documents et les captations sur fichiers"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
automerge = "0.12.0"
noyau = { path = "../noyau" }
sha2 = { version = "0.11.1", default-features = false }
synchro = { path = "../synchro" }

# `pannes` injecte une panne à chaque étape d'une écriture : ses tests seuls la demandent, par
# leur dépendance sur le stockage même.
[features]
pannes = []

[dev-dependencies]
proptest = "1.12.0"
stockage = { path = ".", features = ["pannes"] }
