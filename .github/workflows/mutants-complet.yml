name: mutants-complet

# Le passage complet du test de mutation du noyau : chaque lundi, et à la demande.
# Le job `mutants` de ci.yml, lui, n'examine que les lignes d'une PR.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutants:
    runs-on: ubuntu-latest
    # Deux fois le plus long passage complet, mesuré à froid (« No cache found. ») ou, quand le
    # périmètre de la mutation s'étend avant toute mesure, estimé ; sur quatre cœurs, chaque
    # mutant construisant aussi les tests du rendu. Mesurés : 638 mutants, la boîte comprise, en
    # 35 min 14 s le 2026-11-16, PR #45 (exécution 43775891270) ; avant, 488 en 28 min 53 s,
    # PR #37, et 549 en 23 min 59 s, PR #38, le 2026-11-14 ; 551, sans la boîte, en 24 min 30 s
    # le 2026-11-16, sur main (exécution 43874992227). Estimé le 2026-11-18, PR #47 : le repli,
    # les requêtes, l'index et le journal y ajoutent au plus 245 mutants, ceux que le job
    # `mutants` de sa PR a mutés sur son diff (exécution 44247702454), soit 883 au plus, en
    # 48 min 46 s au prorata du plus long passage (35 min 14 s × 883 / 638) ; deux fois,
    # 97 min 32 s (LE-29 de modele-projet). À remesurer au prochain passage complet.
    timeout-minutes: 98
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Depuis rustup 1.28, `rustup show` n'installe plus la chaîne.
      - name: Installer la chaîne de rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Installer cargo-mutants
        run: cargo install --locked cargo-mutants --version 27.1.0
      - name: Passage complet
        run: cargo mutants -p noyau --jobs "$(nproc)"
