name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  socle:
    uses: ./.github/workflows/modele-socle.yml
    secrets: inherit

  # Refuse les fuites de données personnelles détectables mécaniquement : e-mail,
  # secret, export de mémoire, audio ou MIDI, chemin absolu de machine.
  # Nommé `contenu` pour ne pas se confondre avec `socle / confidentialite`. Voir CONVENTIONS.md.
  contenu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Vérification de confidentialité
        run: bash scripts/verif-confidentialite.sh

  # Deux vérifications de la documentation : chaque lien interne mène quelque part,
  # chaque diagramme se rend. Ajoutées après des diagrammes cassés pendant la refonte
  # d'octobre 2026. Voir CONVENTIONS.md.
  documentation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Vérification des liens internes
        run: node scripts/verif-liens.mjs
      - name: Installer mermaid-cli
        run: npm install --no-save --no-package-lock --no-audit --no-fund @mermaid-js/mermaid-cli@12.0.0
      # Explicite : npm n'exécute bientôt plus les scripts d'installation par défaut,
      # et c'est l'un d'eux qui télécharge le navigateur de Puppeteer.
      - name: Installer le navigateur de Puppeteer
        run: npx --no-install puppeteer browsers install chrome
      - name: Vérification des diagrammes
        run: node scripts/verif-diagrammes.mjs

  # Le code Rust : format, lint, tests du noyau, du cahier et de l'interface.
  # La chaîne vient de rust-toolchain.toml.
  verifier:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Depuis rustup 1.28, `rustup show` n'installe plus la chaîne.
      - name: Installer la chaîne de rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy -p noyau -p cahier --all-targets -- -D warnings
      - name: Lint de l'interface (WebAssembly)
        run: cargo clippy -p interface --target wasm32-unknown-unknown -- -D warnings
      - name: Tests
        run: cargo test -p noyau -p cahier -p interface

  # H10, la partie automatique : l'établi se construit en installateur Windows (NSIS), que
  # la maîtrise d'ouvrage installe ensuite sur un PC pour voir la page s'ouvrir. `trunk` et
  # `tauri-cli` s'installent par `cargo install --locked`, à version épinglée ; installés
  # après `rust-cache`, leurs binaires (~/.cargo/bin) entrent dans le cache, et le passage
  # suivant ne les recompile pas. Pas d'action de binaires prébâtis : une action de moins à épingler.
  # Le job dépose aussi le cahier des tables, daté du commit, pour la tablette et l'impression.
  windows:
    runs-on: windows-latest
    # Deux fois le premier passage mesuré, à froid : 19 min 28 s le 2026-11-01, PR #3 (LE-29 de modele-projet).
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Depuis rustup 1.28, `rustup show` n'installe plus la chaîne.
      - name: Installer la chaîne de rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Installer trunk
        run: cargo install --locked trunk --version 0.22.1
      - name: Installer tauri-cli
        run: cargo install --locked tauri-cli --version 2.12.4
      - name: Construire l'installateur
        working-directory: app/src-tauri
        run: cargo tauri build
      # Après la construction : le lint de l'établi demande app/ui/dist.
      - name: Lint de l'établi
        run: cargo clippy -p etabli --all-targets -- -D warnings
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: etabli-installateur
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
      # La date du rendu est une entrée (I25) : celle du commit. Le shell par défaut du runner
      # Windows est PowerShell, où `$(…)` substitue la commande.
      - name: Cahier des tables
        run: cargo run -p cahier --release -- --date $(git log -1 --format=%cs) --sortie cahier-des-tables.pdf
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cahier-des-tables
          path: cahier-des-tables.pdf
          if-no-files-found: error

  # Le test de mutation du noyau, sur les lignes que la PR modifie (le passage complet est
  # `mutants-complet.yml`). Un diff qui ne touche pas le noyau ne laisse rien à muter : sortie 0.
  mutants:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Deux fois le passage complet mesuré, 309 mutants sur quatre cœurs : 9 min 19 s le
    # 2026-11-02, PR #5 (LE-29 de modele-projet). Le job d'une PR mute, au pire, autant. À remesurer quand le périmètre
    # de la mutation s'étend.
    timeout-minutes: 19
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Depuis rustup 1.28, `rustup show` n'installe plus la chaîne.
      - name: Installer la chaîne de rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Installer cargo-mutants
        run: cargo install --locked cargo-mutants --version 27.1.0
      - name: Diff de la PR
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff "origin/$BASE_REF...HEAD" > pr.diff
      - name: Mutation du noyau
        run: cargo mutants -p noyau --in-diff pr.diff --jobs "$(nproc)"

# Ce fichier est au projet : `copier update` n'y touche plus.
