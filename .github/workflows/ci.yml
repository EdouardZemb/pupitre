name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  socle:
    uses: ./.github/workflows/modele-socle.yml
    secrets: inherit

  # Refuse les fuites de données personnelles détectables mécaniquement dans les fichiers
  # suivis ; CONVENTIONS.md (« Portes de CI ») dit lesquelles.
  # Nommé `contenu` pour ne pas se confondre avec `socle / confidentialite`.
  contenu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Vérification de confidentialité
        run: bash scripts/verif-confidentialite.sh

  # Les vérifications de la documentation : chaque lien interne mène quelque part, chaque
  # diagramme se rend, chaque fait recopié dit la même chose que sa source, et chaque critère
  # inscrit au § 70 · 4.1 a un test qui le nomme. Les deux premières après des diagrammes
  # cassés pendant la refonte d'octobre 2026, la troisième après trois comptes périmés (AM-1,
  # LE-8, LE-9), la dernière après trois constats d'une spec qui se contredit (AM-2, LE-6,
  # LE-11). Voir CONVENTIONS.md.
  documentation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Vérification des liens internes
        run: node scripts/verif-liens.mjs
      - name: Tests de la vérification des faits recopiés
        run: node --test scripts/verif-faits.test.mjs
      # Le jeton lit la règle de protection de main, pour la comparer à CONVENTIONS.md.
      - name: Vérification des faits recopiés
        run: node scripts/verif-faits.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Installer mermaid-cli
        run: npm install --no-save --no-package-lock --no-audit --no-fund @mermaid-js/mermaid-cli@12.0.0
      # Explicite : npm n'exécute bientôt plus les scripts d'installation par défaut,
      # et c'est l'un d'eux qui télécharge le navigateur de Puppeteer.
      - name: Installer le navigateur de Puppeteer
        run: npx --no-install puppeteer browsers install chrome
      - name: Vérification des diagrammes
        run: node scripts/verif-diagrammes.mjs

  # Le code Rust : le Cargo.lock, le graphe de l'interface, le format, le lint et les tests du
  # noyau, du cahier, du stockage, de la synchronisation, des commandes, des services et de
  # l'interface, puis le fonds de mesure. La chaîne vient de rust-toolchain.toml.
  verifier:
    runs-on: ubuntu-latest
    # Deux fois le plus long passage complet mesuré à froid (« No cache found. »), le graphe de
    # l'établi et le fonds de mesure compris : 5 min 53 s le 2026-11-15, PR #43 (exécution
    # 43717435077) ; avant, 4 min 47 s le 2026-11-14, PR #40, sans le fonds de mesure ; depuis,
    # 3 min 55 s le 2026-11-15, PR #44 (exécution 43733973477), le contrôle statique de
    # l'interface compris, et 4 min 11 s le 2026-11-16, PR #45 (exécution 43775887636), la boîte,
    # le bandeau et I29 compris (LE-29 de modele-projet). Le 2026-11-18, la PR #47, les requêtes,
    # leur index et le journal compris, n'a passé qu'à chaud (« Cache hit ») : 1 min 49 s
    # (exécution 44254030959) ; le double reste sous le délai, qui ne baisse pas.
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Depuis rustup 1.28, `rustup show` n'installe plus la chaîne.
      - name: Installer la chaîne de rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Un Cargo.lock en retard sur les Cargo.toml échoue ici, et la CI dépose celui qu'elle a
      # résolu en artefact, à relire puis à committer : le tenir à jour ne demande aucun cargo local.
      - name: Cargo.lock à jour
        run: |
          cargo update --workspace
          git diff --exit-code Cargo.lock
      - name: Déposer le Cargo.lock résolu
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-lock
          path: Cargo.lock
      # L'interface ne tire ni automerge, ni les services, ni le stockage (§ 40 · 3 ; ADR-022) :
      # en natif et en WebAssembly. La sortie se capture d'abord : une erreur de cargo tree fait
      # échouer l'étape (bash -e), au lieu de passer pour une absence. L'essai sur le stockage
      # prouve que la recherche trouve une dépendance, jamais la ligne du paquet racine, qui n'a
      # pas de préfixe. Placée avant les lints : un graphe fautif les ferait échouer avant elle.
      - name: Le graphe de l'interface
        run: |
          interdits='^(automerge|services|stockage) v'
          sortie=$(cargo tree -p stockage -e no-dev --prefix none)
          grep -Eq '^automerge v' <<<"$sortie"
          grep -Eq '^services v' <<<"$sortie"
          for cible in "" "--target wasm32-unknown-unknown"; do
            sortie=$(cargo tree -p interface -e no-dev --prefix none $cible)
            if grep -E "$interdits" <<<"$sortie"; then exit 1; fi
          done
      # L'établi tel qu'il se livre, pour Windows, sa seule cible : ni pannes, ni en-memoire, ni
      # protocol-asset (décision 7 ; I31). L'essai sur le stockage prouve que la recherche trouve une
      # fonction quand ses dépendances de test l'activent, et que -e no-dev l'écarte sans elles.
      - name: Le graphe de l'établi
        run: |
          interdits='feature "(en-memoire|pannes|protocol-asset)"'
          sortie=$(cargo tree -p stockage -e features --prefix none)
          grep -Eq '^stockage feature "pannes"' <<<"$sortie"
          sortie=$(cargo tree -p stockage -e no-dev,features --prefix none)
          if grep -Eq '^stockage feature "pannes"' <<<"$sortie"; then exit 1; fi
          sortie=$(cargo tree -p etabli -e no-dev,features --prefix none --target x86_64-pc-windows-msvc)
          grep -Eq '^tauri feature "' <<<"$sortie"
          if grep -E "$interdits" <<<"$sortie"; then exit 1; fi
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy -p noyau -p cahier -p stockage -p synchro -p commandes -p services --all-targets -- -D warnings
      # Le stockage tel qu'il se livre, sans la fonction `pannes` : chaque commande qui le nomme
      # construit aussi ses cibles de test, donc sa dépendance de test sur lui-même, donc `pannes`.
      # Sans cible de test, celle-ci ne tire aucune dépendance de test (résolveur 3).
      - name: Lint du stockage, sans pannes
        run: cargo clippy -p stockage --lib -- -D warnings
      # Les services tels qu'ils se livrent, sans la fonction `en-memoire` : de même, chaque
      # commande qui les nomme construit aussi leurs cibles de test, donc leur dépendance de test
      # sur eux-mêmes, donc `en-memoire`.
      - name: Lint des services, sans en-memoire
        run: cargo clippy -p services --lib -- -D warnings
      # L'interface, deux fois : en natif, son code de test compris ; en WebAssembly, telle que
      # trunk la construit.
      - name: Lint de l'interface (natif, tests compris)
        run: cargo clippy -p interface --all-targets -- -D warnings
      - name: Lint de l'interface (WebAssembly)
        run: cargo clippy -p interface --target wasm32-unknown-unknown -- -D warnings
      - name: Tests
        run: cargo test -p noyau -p cahier -p interface -p stockage -p synchro -p commandes -p services
      # Une part du test 13 du § 31 · 10, une borne basse : le fonds de mesure, engendré par les
      # opérations nommées puis rouvert sur fichiers, pèse moins de 4 500 000 octets ; il y manque
      # encore les stems et leurs MIDI, les noms d'origine, les origines déclarées, la date,
      # l'appareil et le diapason mesuré de chaque prise, et un acteur par ouverture. L'étape
      # imprime son poids et la durée. Le test est ignoré : « Tests » le saute, et seule cette
      # étape le lance, ici, hors du job windows ; en --release, pour tenir dans le délai de
      # verifier.
      - name: Le fonds de mesure
        run: cargo test -p stockage --release --test mesure -- --ignored --nocapture

  # H10, la partie automatique : l'établi se construit en installateur Windows (NSIS), que
  # la maîtrise d'ouvrage installe ensuite sur un PC pour voir la page s'ouvrir. `trunk` et
  # `tauri-cli` s'installent par `cargo install --locked`, à version épinglée ; installés
  # après `rust-cache`, leurs binaires (~/.cargo/bin) entrent dans le cache, et le passage
  # suivant ne les recompile pas. Pas d'action de binaires prébâtis : une action de moins à épingler.
  # Le job dépose aussi le cahier des tables, daté du commit construit, pour la tablette et
  # l'impression.
  windows:
    runs-on: windows-latest
    # Deux fois le plus long passage complet mesuré à froid (« No cache found. »), le stockage, la
    # synchronisation, l'établi et le cahier compris : 29 min 42 s le 2026-11-14, PR #39, dont
    # 17 min 36 s pour installer trunk et tauri-cli ; 28 min 11 s le 2026-11-15, PR #43 (exécution
    # 43717435077), la sentinelle d'I30 comprise, dont 16 min 11 s ; 23 min 20 s le 2026-11-15,
    # PR #44 (exécution 43733973477), les tests d'I31 compris, dont 13 min 32 s ; 28 min 56 s le
    # 2026-11-16, PR #45 (exécution 43775887636), la boîte, le bandeau et I29 compris, dont
    # 16 min 17 s (LE-29 de modele-projet). Le 2026-11-18, la PR #47, les requêtes comprises
    # dans les tests du stockage et de l'établi, n'a passé qu'à chaud (« Cache hit ») : 5 min 44 s
    # (exécution 44254030959), dont 2 s pour trunk et tauri-cli ; le double reste sous le délai,
    # qui ne baisse pas.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Depuis rustup 1.28, `rustup show` n'installe plus la chaîne.
      - name: Installer la chaîne de rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # H07 sous Windows, où le renommage suit sa voie propre (§ 31 · 2.1). clippy y voit le
      # code propre à Windows, que le job verifier ne compile pas.
      - name: Lint du stockage et de la synchronisation
        run: cargo clippy -p stockage -p synchro --all-targets -- -D warnings
      # Sous Windows aussi, le stockage tel qu'il se livre, sans la fonction `pannes` (voir le job
      # verifier).
      - name: Lint du stockage, sans pannes
        run: cargo clippy -p stockage --lib -- -D warnings
      - name: Tests du stockage et de la synchronisation (H07)
        run: cargo test -p stockage -p synchro
      - name: Installer trunk
        run: cargo install --locked trunk --version 0.22.1
      - name: Installer tauri-cli
        run: cargo install --locked tauri-cli --version 2.12.4
      - name: Construire l'installateur
        working-directory: app/src-tauri
        run: cargo tauri build
      # Après la construction : le lint et les tests de l'établi demandent app/ui/dist.
      - name: Lint de l'établi
        run: cargo clippy -p etabli --all-targets -- -D warnings
      - name: Tests de l'établi
        run: cargo test -p etabli
      # I30 (§ 70 · 3) : les tests de l'établi, relancés sous un dossier de l'application redirigé vers
      # une sentinelle vide. USERPROFILE porte la sentinelle, que SHGetKnownFolderPath développe ; APPDATA et
      # LOCALAPPDATA, ses sous-dossiers, créés d'abord (sans eux, l'appel échoue). CARGO_HOME et RUSTUP_HOME
      # gardent leurs vrais dossiers, lus avant la redirection. L'essai prouve que la recherche voit un
      # fichier caché dans un sous-dossier ; $LASTEXITCODE se lit, puisqu'un exécutable en échec
      # n'arrête pas PowerShell.
      - name: La sentinelle d'I30
        run: |
          $cargo = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          $rustup = if ($env:RUSTUP_HOME) { $env:RUSTUP_HOME } else { Join-Path $env:USERPROFILE '.rustup' }
          $essai = Join-Path $env:RUNNER_TEMP 'sentinelle-essai'
          New-Item -ItemType Directory -Force (Join-Path $essai 'a') | Out-Null
          (New-Item -ItemType File (Join-Path $essai 'a\cache')).Attributes = 'Hidden'
          if (-not (Get-ChildItem -LiteralPath $essai -Recurse -File -Force)) { throw "l'essai ne voit pas le fichier caché" }
          $s = Join-Path $env:RUNNER_TEMP 'sentinelle'
          New-Item -ItemType Directory -Force (Join-Path $s 'AppData\Roaming'), (Join-Path $s 'AppData\Local') | Out-Null
          $env:CARGO_HOME = $cargo
          $env:RUSTUP_HOME = $rustup
          $env:USERPROFILE = $s
          $env:APPDATA = Join-Path $s 'AppData\Roaming'
          $env:LOCALAPPDATA = Join-Path $s 'AppData\Local'
          $env:PUPITRE_SENTINELLE = $s
          cargo test -p etabli -- --include-ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $paru = Get-ChildItem -LiteralPath $s -Recurse -File -Force
          if ($paru) { $paru | ForEach-Object { $_.FullName.Substring($s.Length) }; throw 'un fichier a paru dans la sentinelle' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: etabli-installateur
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
      # La date du rendu est une entrée (I25) : celle du commit construit. Sur une PR, c'est le
      # commit de fusion d'essai que GitHub fabrique (refs/pull/N/merge) : le cahier porte alors
      # la date du jour du passage, et non celle de la tête de la branche. Le shell par défaut du
      # runner Windows est PowerShell, où `$(…)` substitue la commande.
      - name: Cahier des tables
        run: cargo run -p cahier --release -- --date $(git log -1 --format=%cs) --sortie cahier-des-tables.pdf
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cahier-des-tables
          path: cahier-des-tables.pdf
          if-no-files-found: error

  # Le test de mutation du noyau, sur les lignes que la PR modifie (le passage complet est
  # `mutants-complet.yml`). Un diff qui ne touche pas le noyau ne laisse rien à muter : sortie 0.
  mutants:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Deux fois le plus long passage complet mesuré, sur quatre cœurs, chaque mutant construisant
    # aussi les tests du rendu : 851 mutants, le repli, les requêtes, l'index et le journal
    # compris, en 63 min 33 s le 2026-11-18, PR #47 (exécution 44256246979, sur sa branche), à
    # chaud (« Cache hit for restore-key ») ; deux fois, 127 min 6 s. Un passage à froid
    # (« No cache found. ») peut durer plus : à remesurer au premier qui passe. Avant, à froid :
    # 638 mutants, la boîte comprise, en 35 min 14 s le 2026-11-16, PR #45 (exécution
    # 43775891270) ; 488 en 28 min 53 s, PR #37, et 549 en 23 min 59 s, PR #38, le 2026-11-14 ;
    # 551, sans la boîte, en 24 min 30 s le 2026-11-16, sur main (exécution 43874992227)
    # (LE-29 de modele-projet). Le job d'une PR mute, au pire, autant ; à chaud, celui de la
    # PR #47 a muté 245 mutants en 15 min 39 s (exécution 44254030959), et à froid, celui de la
    # PR #45, 102 en 6 min 23 s (exécution 43775887636).
    timeout-minutes: 128
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Depuis rustup 1.28, `rustup show` n'installe plus la chaîne.
      - name: Installer la chaîne de rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Installer cargo-mutants
        run: cargo install --locked cargo-mutants --version 27.1.0
      - name: Diff de la PR
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff "origin/$BASE_REF...HEAD" > pr.diff
      - name: Mutation du noyau
        run: cargo mutants -p noyau --in-diff pr.diff --jobs "$(nproc)"

# Ce fichier est au projet : `copier update` n'y touche plus.
