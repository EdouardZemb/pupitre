name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  socle:
    uses: ./.github/workflows/modele-socle.yml
    secrets: inherit

  # Refuse les fuites de données personnelles détectables mécaniquement dans les fichiers
  # suivis ; CONVENTIONS.md (« Portes de CI ») dit lesquelles.
  # Nommé `contenu` pour ne pas se confondre avec `socle / confidentialite`.
  contenu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Vérification de confidentialité
        run: bash scripts/verif-confidentialite.sh

  # Les vérifications de la documentation : chaque lien interne mène quelque part, chaque
  # diagramme se rend, chaque fait recopié dit la même chose que sa source, et chaque critère
  # inscrit au § 70 · 4.1 a un test qui le nomme. Les deux premières après des diagrammes
  # cassés pendant la refonte d'octobre 2026, la troisième après trois comptes périmés (AM-1,
  # LE-8, LE-9), la dernière après trois constats d'une spec qui se contredit (AM-2, LE-6,
  # LE-11). Voir CONVENTIONS.md.
  documentation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Vérification des liens internes
        run: node scripts/verif-liens.mjs
      - name: Tests de la vérification des faits recopiés
        run: node --test scripts/verif-faits.test.mjs
      # Le jeton lit la règle de protection de main, pour la comparer à CONVENTIONS.md.
      - name: Vérification des faits recopiés
        run: node scripts/verif-faits.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Installer mermaid-cli
        run: npm install --no-save --no-package-lock --no-audit --no-fund @mermaid-js/mermaid-cli@12.0.0
      # Explicite : npm n'exécute bientôt plus les scripts d'installation par défaut,
      # et c'est l'un d'eux qui télécharge le navigateur de Puppeteer.
      - name: Installer le navigateur de Puppeteer
        run: npx --no-install puppeteer browsers install chrome
      - name: Vérification des diagrammes
        run: node scripts/verif-diagrammes.mjs

  # Le code Rust : le Cargo.lock, le format, le lint et les tests du noyau, du cahier, du
  # stockage, de la synchronisation et de l'interface. La chaîne vient de rust-toolchain.toml.
  verifier:
    runs-on: ubuntu-latest
    # Provisoire : le premier passage complet après l'entrée d'automerge, PR #18, a duré 2 min 42 s ;
    # il restaure le cache de main, et n'est froid que pour automerge et ses dépendances. À ramener
    # à deux fois un passage mesuré à froid (LE-29 de modele-projet).
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Depuis rustup 1.28, `rustup show` n'installe plus la chaîne.
      - name: Installer la chaîne de rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Un Cargo.lock en retard sur les Cargo.toml échoue ici, et la CI dépose celui qu'elle a
      # résolu en artefact, à relire puis à committer : le tenir à jour ne demande aucun cargo local.
      - name: Cargo.lock à jour
        run: |
          cargo update --workspace
          git diff --exit-code Cargo.lock
      - name: Déposer le Cargo.lock résolu
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-lock
          path: Cargo.lock
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy -p noyau -p cahier -p stockage -p synchro --all-targets -- -D warnings
      # L'interface, deux fois : en natif, son code de test compris ; en WebAssembly, telle que
      # trunk la construit.
      - name: Lint de l'interface (natif, tests compris)
        run: cargo clippy -p interface --all-targets -- -D warnings
      - name: Lint de l'interface (WebAssembly)
        run: cargo clippy -p interface --target wasm32-unknown-unknown -- -D warnings
      - name: Tests
        run: cargo test -p noyau -p cahier -p interface -p stockage -p synchro

  # H10, la partie automatique : l'établi se construit en installateur Windows (NSIS), que
  # la maîtrise d'ouvrage installe ensuite sur un PC pour voir la page s'ouvrir. `trunk` et
  # `tauri-cli` s'installent par `cargo install --locked`, à version épinglée ; installés
  # après `rust-cache`, leurs binaires (~/.cargo/bin) entrent dans le cache, et le passage
  # suivant ne les recompile pas. Pas d'action de binaires prébâtis : une action de moins à épingler.
  # Le job dépose aussi le cahier des tables, daté du commit construit, pour la tablette et
  # l'impression.
  windows:
    runs-on: windows-latest
    # Deux fois le premier passage mesuré, à froid : 19 min 28 s le 2026-11-01, PR #3 (LE-29 de modele-projet).
    # Le cahier, construit en --release, s'y ajoute depuis la PR #6 : 3 min 44 s pour tout le job, à chaud.
    # Le stockage et la synchronisation, depuis la PR #18 : 4 min 49 s pour le premier passage complet
    # après l'entrée d'automerge, qui restaure le cache de main et n'est froid que pour automerge et
    # ses dépendances ; son double reste sous ces 40 minutes.
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Depuis rustup 1.28, `rustup show` n'installe plus la chaîne.
      - name: Installer la chaîne de rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # H07 sous Windows, où le renommage suit sa voie propre (§ 31 · 2.1). clippy y voit le
      # code propre à Windows, que le job verifier ne compile pas.
      - name: Lint du stockage et de la synchronisation
        run: cargo clippy -p stockage -p synchro --all-targets -- -D warnings
      - name: Tests du stockage et de la synchronisation (H07)
        run: cargo test -p stockage -p synchro
      - name: Installer trunk
        run: cargo install --locked trunk --version 0.22.1
      - name: Installer tauri-cli
        run: cargo install --locked tauri-cli --version 2.12.4
      - name: Construire l'installateur
        working-directory: app/src-tauri
        run: cargo tauri build
      # Après la construction : le lint et les tests de l'établi demandent app/ui/dist.
      - name: Lint de l'établi
        run: cargo clippy -p etabli --all-targets -- -D warnings
      - name: Tests de l'établi
        run: cargo test -p etabli
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: etabli-installateur
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
      # La date du rendu est une entrée (I25) : celle du commit construit. Sur une PR, c'est le
      # commit de fusion d'essai que GitHub fabrique (refs/pull/N/merge) : le cahier porte alors
      # la date du jour du passage, et non celle de la tête de la branche. Le shell par défaut du
      # runner Windows est PowerShell, où `$(…)` substitue la commande.
      - name: Cahier des tables
        run: cargo run -p cahier --release -- --date $(git log -1 --format=%cs) --sortie cahier-des-tables.pdf
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cahier-des-tables
          path: cahier-des-tables.pdf
          if-no-files-found: error

  # Le test de mutation du noyau, sur les lignes que la PR modifie (le passage complet est
  # `mutants-complet.yml`). Un diff qui ne touche pas le noyau ne laisse rien à muter : sortie 0.
  mutants:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Deux fois le passage complet mesuré à froid (« No cache found. »), 333 mutants sur quatre
    # cœurs : 17 min 21 s le 2026-11-05, PR #18, chaque mutant construisant aussi les tests du
    # rendu (LE-29 de modele-projet). Le job d'une PR mute, au pire, autant. À remesurer quand
    # le périmètre de la mutation s'étend.
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Depuis rustup 1.28, `rustup show` n'installe plus la chaîne.
      - name: Installer la chaîne de rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Installer cargo-mutants
        run: cargo install --locked cargo-mutants --version 27.1.0
      - name: Diff de la PR
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff "origin/$BASE_REF...HEAD" > pr.diff
      - name: Mutation du noyau
        run: cargo mutants -p noyau --in-diff pr.diff --jobs "$(nproc)"

# Ce fichier est au projet : `copier update` n'y touche plus.
